/*
 * Root build.gradle
 *
 * This is the top-level build file.
 * It configures the build for all modules (app).
 */

// ============================================================================
// BUILD SCRIPT
// ============================================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:8.1.4'

        // NOTE: No Kotlin plugin — we use Java only
    }
}

// ============================================================================
// ALL PROJECTS
// ============================================================================

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ============================================================================
// CLEAN TASK
// ============================================================================

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
